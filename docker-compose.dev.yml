# docker-compose.dev.yml (optional)
version: "3.9"
services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./apps/dashboard/backend:/app
      - ./logs:/logs:ro
    environment:
      LOGS_DIR: /logs
    command: bash -lc "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  web:
    image: node:22-alpine
    working_dir: /web
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./apps/dashboard/frontend:/web
    command: sh -lc "npm i && npm run dev -- --host --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - api
